name: ClaudeUsage

options:
  bundleIdPrefix: com.wacomapua
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Signed with a real identity rather than ad-hoc, so the designated requirement
    # is `identifier + anchor apple generic + leaf certificate` instead of a bare
    # cdhash. That matters for the Keychain: "Always Allow" stores an ACL against the
    # designated requirement, and an ad-hoc cdhash changes on every single build — so
    # the grant stops matching and macOS prompts again after each rebuild.
    #
    # Manual style: automatic signing insists on a "Mac Development" certificate,
    # which needs Xcode signed in to the developer account. This works with the plain
    # "Apple Development" certificate already in the login Keychain, and needs no
    # provisioning profile now that the App Group entitlement is gone.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: wacomapua@gmail.com (39GRBR78MZ)"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # The host app does the file reading. It is deliberately NOT sandboxed, because it
  # has to reach ~/.claude-* which no sandboxed process can see.
  ClaudeUsage:
    type: application
    platform: macOS
    sources: [Shared, App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wacomapua.claudeusage
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ClaudeUsage.entitlements
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: ClaudeUsageWidget
        embed: true
        codeSign: true

  # macOS forces widget extensions to be sandboxed, so this target only ever reads the
  # snapshot the host app leaves in the shared App Group container.
  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    sources: [Shared, Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wacomapua.claudeusage.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ClaudeUsageWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
